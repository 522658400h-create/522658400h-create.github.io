<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Web 端 + 可视化 · 完整案例网页版" />
  <title>Web 端 + 可视化 · 完整案例</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #20242a;
      color: #20242a;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    img { display: block; max-width: none; }
    a { color: inherit; text-decoration: none; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 56px;
      background: rgba(20, 23, 29, 0.9);
      color: #ffffff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .topbar__inner {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      padding: 0 20px;
    }
    .topbar__back {
      justify-self: start;
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      background: #ffffff;
      color: #20242a;
      font-size: 13px;
      font-weight: 700;
      transition: transform 0.25s ease, background 0.25s ease;
    }
    .topbar__back:hover { transform: translateY(-2px); }
    .topbar__title {
      justify-self: center;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 42vw;
    }
    .topbar__progress {
      justify-self: end;
      min-width: 76px;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .doc { width: 100%; background: #ffffff; }
    .tile { width: 100%; height: auto; background: #ffffff; vertical-align: top; }
    .endline {
      width: 100%;
      padding: 30px 22px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      color: rgba(255, 255, 255, 0.76);
      background: #20242a;
      font-size: 13px;
      line-height: 1.6;
    }
    .endline strong { color: #ffffff; font-size: 14px; }
    .endline a {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 0 15px;
      border-radius: 999px;
      background: #ffffff;
      color: #20242a;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    @media (max-width: 720px) {
      .topbar { height: 52px; }
      .topbar__inner { padding: 0 12px; grid-template-columns: auto 1fr auto; }
      .topbar__back { width: 38px; height: 38px; padding: 0; justify-content: center; font-size: 0; }
      .topbar__back::before {
        content: "";
        width: 16px;
        height: 16px;
        border-left: 2px solid #20242a;
        border-bottom: 2px solid #20242a;
        transform: translateX(2px) rotate(45deg);
      }
      .topbar__title { justify-self: start; font-size: 13px; max-width: none; }
      .topbar__progress { min-width: 62px; padding: 6px 8px; font-size: 11px; }
      .endline { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="topbar__back" href="index.html#work">返回首页</a>
      <div class="topbar__title">Web 端 + 可视化 · 完整案例</div>
      <div class="topbar__progress" id="progress">0%</div>
    </div>
  </header>

  <main class="doc">
    <img class="tile" src="web端+可视化_files/page-1.jpg" width="2880" height="1620" fetchpriority="high" decoding="async" alt="Web端与可视化项目作品 第1页" />
    <img class="tile" src="web端+可视化_files/page-2.jpg" width="2880" height="2110" loading="lazy" decoding="async" alt="Web端与可视化项目作品 第2页" />
    <img class="tile" src="web端+可视化_files/page-3.jpg" width="2880" height="1620" loading="lazy" decoding="async" alt="Web端与可视化项目作品 第3页" />
    <img class="tile" src="web端+可视化_files/page-4.jpg" width="2880" height="7423" loading="lazy" decoding="async" alt="Web端与可视化项目作品 第4页" />
    <img class="tile" src="web端+可视化_files/page-5.jpg" width="2880" height="1620" loading="lazy" decoding="async" alt="Web端与可视化项目作品 第5页" />
    <img class="tile" src="web端+可视化_files/page-6.jpg" width="2880" height="1620" loading="lazy" decoding="async" alt="Web端与可视化项目作品 第6页" />
    <img class="tile" src="web端+可视化_files/page-7.jpg" width="2880" height="1620" loading="lazy" decoding="async" alt="Web端与可视化项目作品 第7页" />
    <img class="tile" src="web端+可视化_files/page-8.jpg" width="2880" height="1620" loading="lazy" decoding="async" alt="Web端与可视化项目作品 第8页" />
    <img class="tile" src="web端+可视化_files/page-9.jpg" width="2880" height="1620" loading="lazy" decoding="async" alt="Web端与可视化项目作品 第9页" />
  </main>

  <footer class="endline">
    <div>
      <strong>Web 端 + 可视化 · 案例网页版</strong><br />
      页面内容与原 PDF 保持完全一致。
    </div>
    <a href="index.html#work">返回作品集</a>
  </footer>

  <script>
    const progress = document.getElementById("progress");
    function updateProgress() {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      const value = max > 0 ? Math.min(100, Math.round((window.scrollY / max) * 100)) : 0;
      progress.textContent = value + "%";
    }
    window.addEventListener("scroll", updateProgress, { passive: true });
    window.addEventListener("resize", updateProgress);
    updateProgress();
  </script>
</body>
</html>
