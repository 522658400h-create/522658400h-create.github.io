    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #dfe2e6;
      color: #20242a;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    img {
      display: block;
      max-width: none;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 56px;
      background: rgba(246, 246, 244, 0.92);
      border-bottom: 1px solid rgba(32, 36, 42, 0.16);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .topbar__inner {
      width: 100%;
      max-width: none;
      height: 100%;
      margin: 0 auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
    }

    .topbar__back {
      justify-self: start;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid rgba(32, 36, 42, 0.24);
      border-radius: 999px;
      background: #ffffff;
      font-size: 13px;
      font-weight: 700;
      transition: transform 0.25s ease, border-color 0.25s ease;
    }

    .topbar__back:hover {
      transform: translateY(-2px);
      border-color: #20242a;
    }

    .topbar__title {
      justify-self: center;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 42vw;
    }

    .topbar__progress {
      justify-self: end;
      min-width: 76px;
      padding: 7px 11px;
      border-radius: 999px;
      background: #ffffff;
      border: 1px solid rgba(32, 36, 42, 0.18);
      font-size: 12px;
      font-weight: 800;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .doc {
      width: 100%;
      max-width: none;
      margin: 0;
      background: #ffffff;
      box-shadow: 0 22px 60px rgba(15, 17, 21, 0.18);
    }

    .tile {
      width: 100%;
      height: auto;
      background: #ffffff;
      vertical-align: top;
    }

    .endline {
      width: 100%;
      max-width: none;
      min-height: 90px;
      margin: 0 auto;
      padding: 26px 22px 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      color: #42474f;
      background: #dfe2e6;
      font-size: 13px;
      line-height: 1.6;
    }

    .endline strong {
      color: #20242a;
      font-size: 14px;
    }

    .endline a {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 0 15px;
      border-radius: 999px;
      background: #20242a;
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    @media (max-width: 720px) {
      .topbar {
        height: 52px;
      }

      .topbar__inner {
        padding: 0 12px;
        grid-template-columns: auto 1fr auto;
      }

      .topbar__back {
        width: 38px;
        height: 38px;
        padding: 0;
        justify-content: center;
        font-size: 0;
      }

      .topbar__back::before {
        content: "";
        width: 16px;
        height: 16px;
        border-left: 2px solid #20242a;
        border-bottom: 2px solid #20242a;
        transform: translateX(2px) rotate(45deg);
      }

      .topbar__title {
        justify-self: start;
        font-size: 13px;
        max-width: none;
      }

      .topbar__progress {
        min-width: 62px;
        padding: 6px 8px;
        font-size: 11px;
      }

      .endline {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

  <script>
    const progress = document.getElementById("progress");

    function updateProgress() {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      const value = max > 0 ? Math.min(100, Math.round((window.scrollY / max) * 100)) : 0;
      progress.textContent = value + "%";
    }

    window.addEventListener("scroll", updateProgress, { passive: true });
    window.addEventListener("resize", updateProgress);
    updateProgress();
  </script>
